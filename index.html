<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ziad Barhoma Search</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
}

.search-container {
    width: 90%;
    max-width: 650px;
    margin: 25px auto 0;
    display: flex;
    direction: rtl;
    background: white;
    border: 2px solid red;
    border-radius: 30px;
    overflow: hidden;
}

input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    border: none;
    outline: none;
    font-size: 18px;
}

button {
    background: red;
    color: white;
    border: none;
    padding: 0 24px;
    font-size: 17px;
    cursor: pointer;
}

.result-box {
    width: 90%;
    max-width: 650px;
    min-height: 220px;
    margin: 150px auto 0;
    background: white;
    color: #111;
    border: 5px solid red;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    font-size: 30px;
    font-weight: bold;
    box-shadow: 0 0 25px rgba(255,0,0,.5);
}

.signature {
    text-align: center;
    color: red;
    font-size: 30px;
    font-weight: bold;
    margin-top: 25px;
    direction: ltr;
    text-shadow: 0 0 10px red;
}

@media(max-width: 500px) {
    .result-box {
        margin-top: 130px;
        min-height: 200px;
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="search-container">
    <input
        type="text"
        id="search"
        placeholder="ابحث عن اسم..."
        onkeydown="if(event.key==='Enter') searchName()"
    >
    <button onclick="searchName()">بحث</button>
</div>

<div class="result-box" id="result">
    اكتب اسم في خانة البحث
</div>

<div class="signature">
    Ziad Barhoma
</div>

<script>

const names = {
    "زياد": "عمك وعم المجال ده",
    "سيف": "سواق متهور"
    "مصطفى": "زُبري منجا"
    "محمد": "هنيك المتناكه",
    "حميده": "هنيك المتناكه",
    "الإيطالي": "زياد الايطالي كينج المجال",
    "ادم": "نشتم الكداب بأمه",
    "إياد": "ماشي يسطا حاضر",
    "أحمد كرم": "ضاني بالحمه البضاني",
    "ياسين كرم": "فلاح",
    "مالك 6": "كينج السيكس في المجال",
    "مالك7": "عجل مدهنن",
    "آمر": "يعم يلعنك"
};

function searchName() {
    let input = document.getElementById("search").value.trim();
    let result = document.getElementById("result");

    let key = Object.keys(names).find(
        name => name.toLowerCase() === input.toLowerCase()
    );

    if (key) {
        result.innerText = names[key];
    } else {
        result.innerText = input === ""
            ? "اكتب اسم الأول"
            : "الاسم مش موجود";
    }
}

</script>

</body>
</html>
